name: Setup Nub workspace
description: Install Node, Nub, and frozen workspace dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "{{nodeVersion}}"
  registry-url:
    description: Optional npm registry URL (e.g. for publishing with provenance).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Nub
      uses: nubjs/setup-nub@18c77eb6d5698e7cf56ce4df1e0fca1eb6b47cd3 # v0.5.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Setup Socket Firewall
      uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free

    - name: Install dependencies
      shell: bash
      run: sfw {{pmInstallCi}}
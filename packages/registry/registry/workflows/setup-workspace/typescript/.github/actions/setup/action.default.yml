name: Setup {{packageManager}} workspace
description: Install Node, {{packageManager}}, and frozen workspace dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "{{nodeVersion}}"
  registry-url:
    description: Optional npm registry URL (e.g. for publishing with provenance).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        cache: {{packageManager}}
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: {{pmInstall}}

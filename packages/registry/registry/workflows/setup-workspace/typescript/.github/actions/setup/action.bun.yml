name: Setup Bun workspace
description: Install Node, Bun, and frozen workspace dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "{{nodeVersion}}"
  registry-url:
    description: Optional npm registry URL (e.g. for publishing with provenance).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: {{pmInstall}}

name: Repository Settings

on:
  push:
    branches:
      - main
    paths:
      - .github/rulesets/**
      - .github/workflows/settings.yml
  pull_request:
    paths:
      - .github/rulesets/**
      - .github/workflows/settings.yml
  workflow_dispatch:

concurrency:
  group: repository-settings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan settings changes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preview ruleset changes
        shell: bash
        env:
          # PAT/App token with administration + rules:write. Default Actions token cannot manage rulesets.
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          # Call GitHub's API with the admin token.
          api() {
            gh api -H "Authorization: Bearer ${GH_ADMIN_TOKEN}" "$@"
          }

          # Look up an existing ruleset id by its declarative name, or empty if missing.
          find_ruleset_id() {
            local name="$1"
            api --paginate "repos/${GITHUB_REPOSITORY}/rulesets" \
              | jq -s -r --arg name "$name" 'add | .[] | select(.name == $name) | .id' \
              | head -n1
          }

          # Report create vs update for each ruleset file without mutating the repo.
          for file in .github/rulesets/*.json; do
            name=$(jq -r '.name' "$file")
            id=$(find_ruleset_id "$name")

            if [[ -n "$id" ]]; then
              echo "would update ruleset '${name}' (id=${id}) from ${file}"
            else
              echo "would create ruleset '${name}' from ${file}"
            fi
          done

      - name: Preview repo settings changes
        shell: bash
        run: |
          set -euo pipefail
          echo "would apply repo merge + security settings:"
          cat <<'JSON'
          {
            "allow_squash_merge": true,
            "allow_merge_commit": false,
            "allow_rebase_merge": false,
            "allow_auto_merge": true,
            "delete_branch_on_merge": true,
            "allow_update_branch": true,
            "squash_merge_commit_title": "PR_TITLE",
            "squash_merge_commit_message": "COMMIT_MESSAGES",
            "security_and_analysis": {
              "advanced_security": {"status": "enabled"},
              "secret_scanning": {"status": "enabled"},
              "secret_scanning_push_protection": {"status": "enabled"},
              "dependabot_security_updates": {"status": "enabled"},
              "code_scanning_default_setup": {"state": "not-configured"}
            }
          }
          JSON

  apply:
    name: Apply settings
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync rulesets
        shell: bash
        env:
          # PAT/App token with administration + rules:write. Default Actions token cannot manage rulesets.
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          # Call GitHub's API with the admin token.
          api() {
            gh api -H "Authorization: Bearer ${GH_ADMIN_TOKEN}" "$@"
          }

          # Look up an existing ruleset id by its declarative name, or empty if missing.
          find_ruleset_id() {
            local name="$1"
            api --paginate "repos/${GITHUB_REPOSITORY}/rulesets" \
              | jq -s -r --arg name "$name" 'add | .[] | select(.name == $name) | .id' \
              | head -n1
          }

          # Idempotent create-or-update: match by ruleset name from each JSON file.
          for file in .github/rulesets/*.json; do
            name=$(jq -r '.name' "$file")
            id=$(find_ruleset_id "$name")

            if [[ -n "$id" ]]; then
              echo "Updating ruleset '${name}' (id=${id}) from ${file}"
              api -X PUT "repos/${GITHUB_REPOSITORY}/rulesets/${id}" \
                --input "$file" --jq '.name'
            else
              echo "Creating ruleset '${name}' from ${file}"
              api -X POST "repos/${GITHUB_REPOSITORY}/rulesets" \
                --input "$file" --jq '.name'
            fi
          done

      - name: Apply repo settings
        shell: bash
        env:
          # PAT/App token with administration + rules:write. Default Actions token cannot manage rulesets.
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          # Call GitHub's API with the admin token.
          api() {
            gh api -H "Authorization: Bearer ${GH_ADMIN_TOKEN}" "$@"
          }

          echo "Applying repo merge + security settings"
          api -X PATCH "repos/${GITHUB_REPOSITORY}" --input - --jq '.full_name' <<'JSON'
          {
            "allow_squash_merge": true,
            "allow_merge_commit": false,
            "allow_rebase_merge": false,
            "allow_auto_merge": true,
            "delete_branch_on_merge": true,
            "allow_update_branch": true,
            "squash_merge_commit_title": "PR_TITLE",
            "squash_merge_commit_message": "COMMIT_MESSAGES",
            "security_and_analysis": {
              "advanced_security": {"status": "enabled"},
              "secret_scanning": {"status": "enabled"},
              "secret_scanning_push_protection": {"status": "enabled"},
              "dependabot_security_updates": {"status": "enabled"}
            }
          }
          JSON
  
          # GitHub's repos PATCH cannot set default setup; this is the endpoint that disables it.
          api -X PATCH "repos/${GITHUB_REPOSITORY}/code-scanning/default-setup" -f state=not-configured

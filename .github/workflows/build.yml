name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Run typechecks
        run: pnpm run typecheck && pnpm -C docs typecheck

      - name: Verify CLI tarball includes bundled registry
        shell: bash
        run: |
          pnpm --filter tuckshop run prepack
          pnpm --filter tuckshop exec npm pack --dry-run --json > pack.json
          jq -e '.[0].files[] | select(.path == "registry.json")' pack.json
          jq -e '.[0].files[] | select(.path | startswith("r/"))' pack.json

name: Release

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma-separated package ids to release, or all"
        required: false
        default: "all"
      bump_override:
        description: "Override the computed bump level"
        required: false
        type: choice
        options:
          - ""
          - patch
          - minor
          - major
      dry_run:
        description: "Preview the release plan without publishing"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Plan and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      # TypeScript variant toolchain setup. Other language variants can keep the
      # same workflow shape and swap only this setup block plus config commands.
      - name: Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Analyze release plan
        env:
          BUMP_OVERRIDE: ${{ inputs.bump_override }}
          PACKAGE_IDS: ${{ inputs.packages }}
        run: |
          ARGS=(--output .release-plan.json --packages "$PACKAGE_IDS")
          if [[ -n "$BUMP_OVERRIDE" ]]; then
            ARGS+=(--bump-override "$BUMP_OVERRIDE")
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          pnpm exec tsx scripts/analyze-release.ts "${ARGS[@]}"

      - name: Stop after dry-run
        if: ${{ inputs.dry_run == true }}
        run: echo "Dry-run complete."

      - name: Apply release plan
        if: ${{ !inputs.dry_run }}
        run: pnpm exec tsx scripts/apply-release.ts --plan .release-plan.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

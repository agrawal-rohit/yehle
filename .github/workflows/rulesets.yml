name: Repository Settings

on:
  push:
    branches:
      - main
    paths:
      - .github/rulesets/**
      - .github/workflows/rulesets.yml
  pull_request:
    paths:
      - .github/rulesets/**
      - .github/workflows/rulesets.yml
  workflow_dispatch:

concurrency:
  group: repository-settings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan settings changes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preview settings changes
        uses: joshjohanning/bulk-github-repo-settings-sync-action@904eddbcb8abdbe583f89d05a19a60fc9371e21d # v2.10.4
        with:
          github-token: ${{ secrets.RULESETS_TOKEN }}
          repositories: ${{ github.repository }}
          rulesets-file: .github/rulesets/protected-branches.json,.github/rulesets/release-tags.json
          allow-squash-merge: true
          allow-merge-commit: false
          allow-rebase-merge: false
          allow-auto-merge: true
          delete-branch-on-merge: true
          allow-update-branch: true
          squash-merge-commit-title: PR_TITLE
          squash-merge-commit-message: COMMIT_MESSAGES
          immutable-releases: true
          code-scanning: true
          secret-scanning: true
          secret-scanning-push-protection: true
          dependabot-alerts: true
          dependabot-security-updates: true
          private-vulnerability-reporting: true
          dry-run: true

  apply:
    name: Apply settings
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply settings changes
        uses: joshjohanning/bulk-github-repo-settings-sync-action@904eddbcb8abdbe583f89d05a19a60fc9371e21d # v2.10.4
        with:
          github-token: ${{ secrets.RULESETS_TOKEN }}
          repositories: ${{ github.repository }}
          rulesets-file: .github/rulesets/protected-branches.json,.github/rulesets/release-tags.json
          allow-squash-merge: true
          allow-merge-commit: false
          allow-rebase-merge: false
          allow-auto-merge: true
          delete-branch-on-merge: true
          allow-update-branch: true
          squash-merge-commit-title: PR_TITLE
          squash-merge-commit-message: COMMIT_MESSAGES
          immutable-releases: true
          code-scanning: true
          secret-scanning: true
          secret-scanning-push-protection: true
          dependabot-alerts: true
          dependabot-security-updates: true
          private-vulnerability-reporting: true
          dry-run: false
